name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        # Guards against tagging a release whose crate version was not bumped:
        # the binary reports CARGO_PKG_VERSION at runtime (startup log, /health,
        # FITS headers), so a mismatch ships a mislabeled build. Fail fast here
        # instead. Reads the first `version =` line, which is the [package] one.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $CRATE"
            exit 1
          fi
          echo "OK: tag and crate version both $CRATE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl C toolchain
        # ring (a rustls-tls dependency) has C/assembly bits that need a
        # musl-targeting C compiler at build time, even though rustls-tls
        # itself is "pure Rust" from the API surface. `musl-tools` installs
        # `musl-gcc`; cc-rs looks for a target-triple-prefixed name by
        # default, so point it there explicitly via CC_<target>.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build astroburst-server (static musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release \
            --target x86_64-unknown-linux-musl \
            --no-default-features \
            --features server,astrometry-net,asdf-full,vizier \
            --bin astroburst-server

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST="astroburst-server-${VERSION}-linux-x86_64"
          mkdir -p "$DIST"
          cp "target/x86_64-unknown-linux-musl/release/astroburst-server" "$DIST/"
          cp SERVER.md SERVER_TESTING.md LICENSE "$DIST/"
          tar czf "${DIST}.tar.gz" "$DIST"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: astroburst-server ${{ github.ref_name }}
          draft: true
          files: astroburst-server-*-linux-x86_64.tar.gz
